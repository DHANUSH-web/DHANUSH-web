<svg width="850" height="240" viewBox="0 0 850 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#070a0f"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#bc8cff" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#79C0FF"/>
      <stop offset="45%" stop-color="#56D364"/>
      <stop offset="100%" stop-color="#7EE787"/>
    </linearGradient>

    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C9D1D9"/>
      <stop offset="100%" stop-color="#8B949E"/>
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2ea043" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a371f7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Inter:wght@400;600;800;900&amp;display=swap');
      
      .title-text {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 900;
        font-size: 38px;
        letter-spacing: -1px;
      }
      .tag-text {
        font-family: 'Fira Code', monospace;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
      .code-prompt {
        font-family: 'Fira Code', monospace;
        font-size: 13.5px;
        fill: #79C0FF;
      }
      .cursor {
        animation: blink 1s infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .glow-orb {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(1) translate(0, 0); opacity: 0.3; }
        100% { transform: scale(1.15) translate(-10px, 10px); opacity: 0.5; }
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="846" height="236" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Ambient Glow Orbs -->
  <g filter="url(#glow)">
    <circle cx="750" cy="50" r="70" fill="#238636" class="glow-orb" opacity="0.3"/>
    <circle cx="100" cy="190" r="60" fill="#1f6feb" class="glow-orb" opacity="0.25"/>
  </g>

  <!-- Terminal Window Bar -->
  <path d="M 2 16 Q 2 2 16 2 L 834 2 Q 848 2 848 16 L 848 38 L 2 38 Z" fill="#161b22" fill-opacity="0.8"/>
  <line x1="2" y1="38" x2="848" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Window Dots -->
  <circle cx="22" cy="20" r="5.5" fill="#ff5f56"/>
  <circle cx="38" cy="20" r="5.5" fill="#ffbd2e"/>
  <circle cx="54" cy="20" r="5.5" fill="#27c93f"/>

  <!-- Window Title -->
  <text x="425" y="24" fill="#8b949e" font-family="'Fira Code', monospace" font-size="11.5" text-anchor="middle" font-weight="500">dhanush@bengaluru: ~ (zsh)</text>

  <!-- Main Hero Content -->
  <!-- Name / Brand -->
  <text x="40" y="88" fill="url(#titleGrad)" class="title-text">DHANUSH H V</text>

  <!-- Role / Subtitle -->
  <text x="40" y="116" fill="url(#subGrad)" font-family="'Inter', sans-serif" font-size="15" font-weight="600" letter-spacing="1">FULL-STACK &amp; SYSTEMS CRAFTSMAN</text>

  <!-- Terminal Command Line Prompt -->
  <g transform="translate(40, 138)">
    <rect x="0" y="0" width="770" height="36" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="14" y="23" class="code-prompt">
      <tspan fill="#3fb950">❯ </tspan><tspan fill="#79c0ff">load-flagships</tspan><tspan fill="#c9d1d9"> [DeepCleanMyMac, dcmmlib, mux, portfolio, c/cpp-logger]</tspan>
    </text>
    <rect x="670" y="10" width="8" height="15" fill="#58a6ff" class="cursor"/>
  </g>

  <!-- Skill Pill Badges inside Hero Banner -->
  <g transform="translate(40, 192)">
    <!-- Pill 1: Systems -->
    <rect x="0" y="0" width="180" height="26" rx="13" fill="url(#pillGrad1)" stroke="#388bfd" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="12" cy="13" r="4" fill="#58a6ff"/>
    <text x="24" y="17" fill="#79c0ff" class="tag-text">macOS &amp; Systems</text>

    <!-- Pill 2: Web -->
    <rect x="192" y="0" width="165" height="26" rx="13" fill="url(#pillGrad2)" stroke="#3fb950" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="204" cy="13" r="4" fill="#3fb950"/>
    <text x="216" y="17" fill="#7ee787" class="tag-text">Next.js &amp; Web</text>

    <!-- Pill 3: Location -->
    <rect x="369" y="0" width="175" height="26" rx="13" fill="url(#pillGrad3)" stroke="#a371f7" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="381" cy="13" r="4" fill="#bc8cff"/>
    <text x="393" y="17" fill="#d2a8ff" class="tag-text">Bengaluru, IN (IST)</text>

    <!-- Pill 4: Status -->
    <g transform="translate(556, 0)">
      <rect x="0" y="0" width="214" height="26" rx="13" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <circle cx="14" cy="13" r="4" fill="#3fb950" class="cursor"/>
      <text x="26" y="17" fill="#c9d1d9" class="tag-text">Status: Shipping Fast</text>
    </g>
  </g>
</svg>
