<svg width="850" height="175" viewBox="0 0 850 175" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="muxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#110e1a"/>
      <stop offset="50%" stop-color="#181324"/>
      <stop offset="100%" stop-color="#0c0914"/>
    </linearGradient>
    <linearGradient id="muxBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0883e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#dea584" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="muxTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#dea584"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background Box -->
  <rect x="2" y="2" width="846" height="171" rx="12" fill="url(#muxBg)" stroke="url(#muxBorder)" stroke-width="1.5"/>

  <!-- Centered Content -->
  <!-- 1. Top Badge -->
  <g transform="translate(425, 20)">
    <rect x="-95" y="0" width="190" height="22" rx="11" fill="#f0883e" fill-opacity="0.2" stroke="#f0883e" stroke-opacity="0.5"/>
    <text x="0" y="15" fill="#dea584" font-size="10.5" font-weight="700" class="mono" text-anchor="middle">📦 FLAGSHIP DEVELOPER CLI</text>
  </g>

  <!-- 2. Main Title -->
  <text x="425" y="76" fill="url(#muxTitleGrad)" font-size="28" font-weight="900" class="sans" text-anchor="middle" letter-spacing="-0.5">mux <tspan fill="#dea584" font-size="20" font-weight="600">(Rust)</tspan> &amp; mux.dev</text>

  <!-- 3. Subtitle -->
  <text x="425" y="104" fill="#c9d1d9" font-size="13.5" font-weight="400" class="sans" text-anchor="middle">Cargo-like project workflow manager for C/C++ developers &amp; official Next.js documentation platform</text>

  <!-- 4. Quick Highlights Pill -->
  <g transform="translate(425, 126)">
    <rect x="-240" y="0" width="480" height="28" rx="14" fill="#0d0a15" stroke="#30363d" stroke-width="1"/>
    <text x="0" y="18" fill="#8b949e" font-size="11.5" class="mono" text-anchor="middle">
      <tspan fill="#3fb950">Native Binary</tspan> &#160;·&#160; <tspan fill="#58a6ff">Pure Rust</tspan> &#160;·&#160; <tspan fill="#d2a8ff">Cross Platform</tspan>
    </text>
  </g>
</svg>
