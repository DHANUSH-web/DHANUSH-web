<svg width="850" height="210" viewBox="0 0 850 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="muxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="muxBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f0883e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.8"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Inter:wght@700;800;900&amp;display=swap');
      .mono { font-family: 'Fira Code', monospace; }
      .sans { font-family: 'Inter', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background Box -->
  <rect x="2" y="2" width="846" height="206" rx="12" fill="url(#muxBg)" stroke="url(#muxBorder)" stroke-width="1.5"/>

  <!-- Left Side: Product Branding -->
  <g transform="translate(32, 28)">
    <!-- Badge -->
    <rect x="0" y="0" width="108" height="22" rx="11" fill="#f0883e" fill-opacity="0.15" stroke="#f0883e" stroke-opacity="0.5"/>
    <text x="54" y="15" fill="#f0883e" font-size="11" font-weight="700" class="mono" text-anchor="middle">FLAGSHIP CLI</text>

    <!-- Title -->
    <text x="0" y="62" fill="#ffffff" font-size="32" font-weight="900" class="sans" letter-spacing="-0.5">mux <tspan fill="#dea584" font-size="20" font-weight="600">v1.0 (Rust)</tspan></text>
    
    <!-- Tagline -->
    <text x="0" y="88" fill="#c9d1d9" font-size="13.5" font-weight="400" class="sans">Cargo-like project workflow &amp; package orchestration for C/C++</text>

    <!-- Quick Stats Pill -->
    <g transform="translate(0, 112)">
      <rect x="0" y="0" width="340" height="28" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="18" fill="#8b949e" font-size="12" class="mono">
        <tspan fill="#3fb950">⚡ Instant scaffold</tspan> · <tspan fill="#58a6ff">📦 Fast build</tspan> · <tspan fill="#d2a8ff">🧪 Tests</tspan>
      </text>
    </g>
  </g>

  <!-- Right Side: Terminal Execution Preview -->
  <g transform="translate(420, 22)">
    <rect x="0" y="0" width="398" height="166" rx="8" fill="#090d13" stroke="#30363d" stroke-width="1"/>
    
    <!-- Mini Terminal Header -->
    <circle cx="14" cy="14" r="4" fill="#ff5f56"/>
    <circle cx="26" cy="14" r="4" fill="#ffbd2e"/>
    <circle cx="38" cy="14" r="4" fill="#27c93f"/>
    <text x="200" y="17" fill="#6e7681" font-size="10" font-weight="600" class="mono" text-anchor="middle">terminal — mux build --release</text>
    <line x1="0" y1="28" x2="398" y2="28" stroke="#21262d" stroke-width="1"/>

    <!-- Terminal Code Lines -->
    <g transform="translate(14, 48)" class="mono" font-size="11.5">
      <text x="0" y="0" fill="#79c0ff"><tspan fill="#3fb950">$ </tspan>mux new my_engine --cpp</text>
      <text x="0" y="20" fill="#8b949e"><tspan fill="#3fb950">  Created</tspan> binary (application) `my_engine` package</text>
      
      <text x="0" y="46" fill="#79c0ff"><tspan fill="#3fb950">$ </tspan>mux run --release</text>
      <text x="0" y="66" fill="#8b949e"><tspan fill="#56d364">Compiling</tspan> main.cpp (opt-level: 3, clang++)</text>
      <text x="0" y="86" fill="#3fb950"> Finished<tspan fill="#c9d1d9"> release [optimized] target in 0.24s</tspan></text>
      <text x="0" y="106" fill="#58a6ff">  Running<tspan fill="#ffffff"> `bin/my_engine` [output: 200 OK]</tspan></text>
    </g>
  </g>
</svg>
