<svg width="850" height="210" viewBox="0 0 850 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="dcmmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121d"/>
      <stop offset="100%" stop-color="#111a28"/>
    </linearGradient>
    <linearGradient id="dcmmBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#56d364" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0.8"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Inter:wght@700;800;900&amp;display=swap');
      .mono { font-family: 'Fira Code', monospace; }
      .sans { font-family: 'Inter', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background Box -->
  <rect x="2" y="2" width="846" height="206" rx="12" fill="url(#dcmmBg)" stroke="url(#dcmmBorder)" stroke-width="1.5"/>

  <!-- Left Side: Product Branding -->
  <g transform="translate(32, 28)" align="center">
    <!-- Badge -->
    <rect x="0" y="0" width="168" height="22" rx="11" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd" stroke-opacity="0.5"/>
    <text x="84" y="15" fill="#79c0ff" font-size="10.5" font-weight="700" class="mono" text-anchor="middle">FLAGSHIP macOS SUITE</text>

    <!-- Title -->
    <text x="0" y="62" fill="#ffffff" font-size="28" font-weight="900" class="sans" letter-spacing="-0.5">DeepCleanMyMac <tspan fill="#79c0ff" font-size="25" font-weight="600"></tspan></text>
    
    <!-- Tagline -->
    <text x="0" y="88" fill="#c9d1d9" font-size="13" font-weight="400" class="sans">Light and Fast system space reclamation &amp; developer cache sanitizer</text>

    <!-- Quick Stats Pill -->
    <g transform="translate(0, 112)">
      <rect x="0" y="0" width="348" height="28" rx="6" fill="#090d13" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="18" fill="#8b949e" font-size="11.5" class="mono">
        <tspan fill="#3fb950">Deep Mac Scan</tspan> · <tspan fill="#58a6ff">Dev caches</tspan> · <tspan fill="#7ee787">Free &amp; Open-Source</tspan>
      </text>
    </g>
  </g>

  <!-- Right Side: Application -->
  <g>
    <img src="profile/dcmm-icon.png" />
  </g>
</svg>
