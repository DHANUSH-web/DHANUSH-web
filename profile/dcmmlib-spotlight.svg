<svg width="850" height="175" viewBox="0 0 850 175" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="libBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081411"/>
      <stop offset="50%" stop-color="#0c1d18"/>
      <stop offset="100%" stop-color="#07110e"/>
    </linearGradient>
    <linearGradient id="libBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="libTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#56d364"/>
      <stop offset="100%" stop-color="#79c0ff"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background Box -->
  <rect x="2" y="2" width="846" height="171" rx="12" fill="url(#libBg)" stroke="url(#libBorder)" stroke-width="1.5"/>

  <!-- Centered Content -->
  <!-- 1. Top Badge -->
  <g transform="translate(425, 20)">
    <rect x="-95" y="0" width="190" height="22" rx="11" fill="#238636" fill-opacity="0.2" stroke="#3fb950" stroke-opacity="0.5"/>
    <text x="0" y="15" fill="#7ee787" font-size="10.5" font-weight="700" class="mono" text-anchor="middle">⚙️ CORE ENGINE FRAMEWORK</text>
  </g>

  <!-- 2. Main Title -->
  <text x="425" y="76" fill="url(#libTitleGrad)" font-size="28" font-weight="900" class="sans" text-anchor="middle" letter-spacing="-0.5">dcmmlib</text>

  <!-- 3. Subtitle -->
  <text x="425" y="104" fill="#c9d1d9" font-size="13.5" font-weight="400" class="sans" text-anchor="middle">High-performance filesystem traversal &amp; cache sanitization engine powering DeepCleanMyMac</text>

  <!-- 4. Quick Highlights Pill -->
  <g transform="translate(425, 126)">
    <rect x="-240" y="0" width="480" height="28" rx="14" fill="#050e0c" stroke="#30363d" stroke-width="1"/>
    <text x="0" y="18" fill="#8b949e" font-size="11.5" class="mono" text-anchor="middle">
      <tspan fill="#3fb950">Pure C/C++ Framework</tspan> &#160;·&#160; <tspan fill="#58a6ff">Cross Platform</tspan> &#160;·&#160; <tspan fill="#7ee787">Free &amp; Open-Source</tspan>
    </text>
  </g>
</svg>
