<svg width="850" height="210" viewBox="0 0 850 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="libBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1614"/>
      <stop offset="100%" stop-color="#0d1f19"/>
    </linearGradient>
    <linearGradient id="libBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3fb950" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0.7"/>
    </linearGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&amp;family=Inter:wght@700;800;900&amp;display=swap');
      .mono { font-family: 'Fira Code', monospace; }
      .sans { font-family: 'Inter', system-ui, sans-serif; }
    </style>
  </defs>

  <!-- Background Box -->
  <rect x="2" y="2" width="846" height="206" rx="12" fill="url(#libBg)" stroke="url(#libBorder)" stroke-width="1.5"/>

  <!-- Left Side: Product Branding -->
  <g transform="translate(32, 28)">
    <!-- Badge -->
    <rect x="0" y="0" width="175" height="22" rx="11" fill="#238636" fill-opacity="0.2" stroke="#3fb950" stroke-opacity="0.5"/>
    <text x="87" y="15" fill="#7ee787" font-size="10.5" font-weight="700" class="mono" text-anchor="middle">CORE SYSTEMS ENGINE</text>

    <!-- Title -->
    <text x="0" y="62" fill="#ffffff" font-size="30" font-weight="900" class="sans" letter-spacing="-0.5">dcmmlib <tspan fill="#3fb950" font-size="18" font-weight="600">v1.0 (Core Engine)</tspan></text>
    
    <!-- Tagline -->
    <text x="0" y="88" fill="#c9d1d9" font-size="13" font-weight="400" class="sans">High-throughput filesystem engine driving DeepCleanMyMac</text>

    <!-- Quick Stats Pill -->
    <g transform="translate(0, 112)">
      <rect x="0" y="0" width="348" height="28" rx="6" fill="#090d13" stroke="#30363d" stroke-width="1"/>
      <text x="12" y="18" fill="#8b949e" font-size="11.5" class="mono">
        <tspan fill="#3fb950">⚡ 480k inodes/sec</tspan> · <tspan fill="#58a6ff">🔒 POSIX safe</tspan> · <tspan fill="#7ee787">🧵 Multi-core</tspan>
      </text>
    </g>
  </g>

  <!-- Right Side: Code / Execution Preview -->
  <g transform="translate(420, 22)">
    <rect x="0" y="0" width="398" height="166" rx="8" fill="#080e0c" stroke="#30363d" stroke-width="1"/>
    
    <!-- Mini Terminal Header -->
    <circle cx="14" cy="14" r="4" fill="#ff5f56"/>
    <circle cx="26" cy="14" r="4" fill="#ffbd2e"/>
    <circle cx="38" cy="14" r="4" fill="#27c93f"/>
    <text x="200" y="17" fill="#6e7681" font-size="10" font-weight="600" class="mono" text-anchor="middle">engine — dcmmlib::scanner::sweep()</text>
    <line x1="0" y1="28" x2="398" y2="28" stroke="#21262d" stroke-width="1"/>

    <!-- Code / Log Lines -->
    <g transform="translate(14, 48)" class="mono" font-size="11">
      <text x="0" y="0" fill="#79c0ff"><tspan fill="#d2a8ff">auto </tspan>engine = dcmmlib::Engine::<tspan fill="#56d364">init</tspan>();</text>
      <text x="0" y="18" fill="#c9d1d9"><tspan fill="#d2a8ff">auto </tspan>plan = engine.<tspan fill="#56d364">scan_tree</tspan>(Target::CachePool);</text>
      <text x="0" y="38" fill="#8b949e">  [dcmmlib::audit] Traversed 482,104 inodes in 84ms</text>
      <text x="0" y="58" fill="#79c0ff">engine.<tspan fill="#56d364">execute_clean</tspan>(plan, Policy::StrictSafety);</text>
      <text x="0" y="78" fill="#3fb950">✔ Sanitization complete (0 permission faults, 100% verified)</text>
    </g>
  </g>
</svg>
