name: update stats cards

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/stats.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=0D1117&title_color=79C0FF&text_color=C9D1D9&icon_color=3FB950&ring_color=3FB950

      - name: Top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=0D1117&title_color=79C0FF&text_color=C9D1D9

      - name: Pin mux
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          path: profile/pin-mux.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=${{ github.repository_owner }}&repo=mux&hide_border=true&bg_color=0D1117&title_color=79C0FF&text_color=C9D1D9&icon_color=3FB950

      - name: Pin c-logger
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          path: profile/pin-c-logger.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=${{ github.repository_owner }}&repo=c-logger&hide_border=true&bg_color=0D1117&title_color=79C0FF&text_color=C9D1D9&icon_color=3FB950

      - name: Pin cpp-logger
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          path: profile/pin-cpp-logger.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          options: username=${{ github.repository_owner }}&repo=cpp-logger&hide_border=true&bg_color=0D1117&title_color=79C0FF&text_color=C9D1D9&icon_color=3FB950

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Refresh GitHub stats cards" || exit 0
          git push
